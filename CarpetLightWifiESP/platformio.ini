; PlatformIO Project Configuration File
;
; CarpetLightWifiESP -- WiFi radio bridge firmware for the CarpetLightCode
; light show controller's realtime monitor/interface mode. Runs on a
; standalone ESP32-WROOM-32 board (e.g. a "D1 Mini ESP32" clone), wired to
; the Due over a dedicated UART, NOT the Due's USB port -- see
; CarpetLightCode's README.md ("Realtime radio monitor/interface role")
; and ~/.claude/plans/quiet-watching-cherny.md for the full design.
;
; This firmware is intentionally a "dumb pipe": it hosts the WiFi AP and a
; WebSocket server, and forwards payload bytes to/from the Due's UART
; verbatim. It never parses message contents -- that logic lives entirely
; in CarpetLightCode's Due-side RadioLink class and the visualizer's JS.
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	links2004/WebSockets@^2.4.1
